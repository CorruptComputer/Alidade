<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- COOP/COEP required for SharedArrayBuffer (WASM threads) in production -->
    <meta http-equiv="Cross-Origin-Opener-Policy" content="same-origin" />
    <meta http-equiv="Cross-Origin-Embedder-Policy" content="require-corp" />

    <title>Alidade</title>
    <base href="/" />

    <link rel="preload" id="webassembly" />

    <link rel="stylesheet" href="assets/css/app.css" />
    <link href="Alidade.styles.css" rel="stylesheet" />

    <link href="manifest.webmanifest" rel="manifest" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link rel="apple-touch-icon" sizes="512x512" href="icon-512.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="icon-192.png" />

    <link rel="stylesheet" href="_content/Alidade.Map/assets/lib/maplibre-gl/maplibre-gl.css" />
    <script type="importmap"></script>
</head>

<body>
    <div id="app">
        <svg class="loading-progress">
            <circle r="40%" cx="50%" cy="50%" />
            <circle r="40%" cx="50%" cy="50%" />
        </svg>
        <div class="loading-progress-text"></div>
    </div>

    <div id="blazor-error-ui">

        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>

    <script src="_content/Alidade.Map/assets/lib/maplibre-gl/maplibre-gl.bundle.js"></script>

    <script src="_content/Alidade.Map/assets/js/map-interop.js"></script>

    <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>
    <script>navigator.serviceWorker.register('service-worker.js', { updateViaCache: 'none' });</script>

</html>
